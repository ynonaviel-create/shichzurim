<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ארכיון השחזורים">
  <!-- אייקון הלשונית. הרנדר התלת-ממדי המלא (assets/img/logo.png) נמרח לרעש
       מתחת ל-36px, וגם ניסיון לצייר את שלושת הכרטיסים כווקטור נכשל: ב-16px
       הם מתמזגים לגוש טורקיז אחד. בגודל הזה יש מקום לאלמנט אחד בלבד, ולכן
       נשאר רק מה שנושא את המשמעות — הווי הירוק על הטורקיז.

       הצבעים אינם ה-#2b7c8a של הלוגו במדויק: מול הירוק הוא נותן ניגודיות
       של 1.72:1 והווי נבלע. עומק אחד למטה (#16717a מול #57cc2e) מגיע ל-2.74:1
       ועדיין קורא כטורקיז של המותג. הריבוע המלא מכוון — הוא מה שנותן לאייקון
       נוכחות גם ברצועת לשוניות בהירה וגם בכהה. -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#16717a"/>
  <path d="M8.3 16.6l5.4 5.4 10-11.8" fill="none" stroke="#57cc2e" stroke-width="4.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
